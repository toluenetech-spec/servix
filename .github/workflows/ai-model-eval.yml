name: AI model evaluation (audit only)

# Audit tooling. Boots the REAL Servix API on a throwaway PostgreSQL inside the
# runner and scores candidate models on Servix tasks. Touches no production
# system. Results are uploaded as artifacts and written to the job summary.
# API keys are read ONLY from repository secrets and are never printed.
#
#   AI_API_KEY → Dahl (https://inference.dahl.global/v1)
#
# Results are committed to docs/ai-eval/<provider>/ on this branch so they can
# be read without downloading artifacts. (NVIDIA job removed at owner's request.)

on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Comma-separated model ids to test (blank = auto-detect by name)'
        required: false
        default: ''
  push:
    branches: [arena/01a0dc4c-servix]
    paths:
      - 'api/scripts/aiModelEval.ts'
      - '.github/workflows/ai-model-eval.yml'

permissions:
  contents: write

jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: dahl
            base_url: https://inference.dahl.global/v1
            secret_name: AI_API_KEY
            min_gap_ms: '1200'
    name: ${{ matrix.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Evaluate models against the real Servix API
        env:
          AI_API_KEY: ${{ secrets[matrix.secret_name] }}
          AI_BASE_URL: ${{ matrix.base_url }}
          AI_MIN_GAP_MS: ${{ matrix.min_gap_ms }}
          AI_MODEL_BUDGET_MS: '900000'
          MODELS_INPUT: ${{ github.event.inputs.models }}
        run: |
          if [ -z "$AI_API_KEY" ]; then
            echo "::notice::Secret ${{ matrix.secret_name }} is not set — skipping ${{ matrix.provider }}."
            exit 0
          fi
          ARGS=""
          if [ -n "$MODELS_INPUT" ]; then ARGS="--models $MODELS_INPUT"; fi
          npx tsx scripts/aiModelEval.ts --out "$GITHUB_WORKSPACE/docs/ai-eval/${{ matrix.provider }}" $ARGS

      - name: Publish summary
        if: always()
        run: |
          echo "## ${{ matrix.provider }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$GITHUB_WORKSPACE/docs/ai-eval/${{ matrix.provider }}/results.md" ]; then
            cat "$GITHUB_WORKSPACE/docs/ai-eval/${{ matrix.provider }}/results.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No results produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit results to the branch
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          if [ ! -d docs/ai-eval/${{ matrix.provider }} ]; then echo "nothing to commit"; exit 0; fi
          git config user.name "servix-ai-eval[bot]"
          git config user.email "ai-eval@users.noreply.github.com"
          git add docs/ai-eval/${{ matrix.provider }}
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "ai-eval(${{ matrix.provider }}): results from run ${{ github.run_id }} [skip ci]"
          for i in 1 2 3; do git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break || sleep 5; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-eval-${{ matrix.provider }}
          path: docs/ai-eval/${{ matrix.provider }}
          if-no-files-found: ignore
