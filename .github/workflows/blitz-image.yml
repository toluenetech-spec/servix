name: Blitz container image

# Builds the linux/amd64 image that blitz.cloud runs.
#
#   pull request / push -> build only. Nothing is published, nothing deploys.
#   manual run          -> build, and publish only if you tick `publish`.
#
# The `secrets` context cannot be referenced from an `if:` condition, and is
# not dependable in a workflow-level `env:` block. It is therefore only read
# where GitHub documents it as available: a step's `env:` block and an
# action's `with:`. SHOULD_PUBLISH is computed at JOB level from the `github`
# and `inputs` contexts, which is the documented workaround.

on:
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/blitz-image.yml'
  push:
    branches: [main, phases-full]
    paths:
      - 'api/**'
      - '.github/workflows/blitz-image.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the verified image to Docker Hub'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest
    env:
      SHOULD_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Note build-only mode
        if: env.SHOULD_PUBLISH != 'true'
        run: echo "Build-only verification — no image will be published and nothing will be deployed."

      - name: Verify Docker Hub credentials are present
        # Secrets can be read from a step's env block, so the check happens in
        # the shell rather than in an `if` condition.
        if: env.SHOULD_PUBLISH == 'true'
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DH_USER" ] || [ -z "$DH_TOKEN" ]; then
            echo "::error::Publishing requires the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."
            exit 1
          fi

      - name: Log in to Docker Hub
        if: env.SHOULD_PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and optionally publish the linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          platforms: linux/amd64
          push: ${{ env.SHOULD_PUBLISH == 'true' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/servix-api:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/servix-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
